# ============================================================
# youyu 站点的「应用配置」片段，由 server 块 include 进来。
#
# 为什么要拆出这个文件：certbot 会直接改写 /etc/nginx/conf.d/youyu.conf，
# 往里追加 443 / ssl_* / 301 重定向等段落。若部署脚本整文件覆盖它，就会把
# certbot 的成果抹掉、HTTPS 立刻挂掉；而不覆盖，仓库里的配置就永远只是文档，
# 与线上漂移（这正是「已发版但客户端一直加载旧版」那次事故的根因：线上配置
# 停留在 PWA 之前的版本，连 /app/ 的 location 都没有）。
#
# 于是划分职责：
#   - certbot 管 server 块的骨架：listen / server_name / ssl_* / 301 跳转
#   - 本文件管应用配置：root / index / location / gzip / 请求体上限
# 部署脚本只同步本文件，永远不碰 youyu.conf，两边互不干扰。
#
# 安装位置：/etc/nginx/snippets/youyu-locations.conf
# 由 deploy/ci-deploy-remote.sh 在每次部署时同步（nginx -t 不通过则自动回滚）。
# ============================================================

root /opt/youyu/web;
index index.html;

# ---------------- HTML：一律不缓存，保证发版即时生效 ----------------
#
# add_header 必须写在下面两个【前缀块】里，不能只依赖 `location = /index.html`
# 和 `location = /app/index.html`：nginx 的精确匹配按【请求 URI】判定，与
# try_files 最终命中哪个文件无关。客户端访问的是目录形式的 `/` 与 `/app/`，
# 命中的是前缀块，精确块根本不参与。少了这一条，HTML 就没有任何 Cache-Control，
# 会被浏览器 / Android WebView 按 Last-Modified 启发式缓存住，旧 HTML 又引用
# 旧的带指纹 chunk，表现为「已发版但客户端一直是旧版」。
#
# 这里的 no-cache 不会波及带指纹的静态资源：`/assets/` 与 `/app/assets/` 都是
# 更长的前缀，匹配优先级高于 `/` 与 `/app/`，仍走各自的 30 天长缓存。
#
# always 使 304 响应也带上该头（add_header 默认只作用于部分 2xx/3xx）。

# 营销落地站（Vue，根路径）：SPA 路由回退到根 index.html。
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# 记账应用本体（uni-app H5，同源子路径 /app/）：SPA 路由回退到 /app/index.html。
location /app/ {
    try_files $uri $uri/ /app/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# 直接请求带文件名的 HTML 时（非目录形式）同样不缓存。
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
location = /app/index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# 根路径的 sw.js 是自注销脚本，用于让历史 PWA 老客户端自愈（见 web/public/sw.js）。
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# 记账应用的 PWA 控制文件（作用域限定 /app/，勿挪到站点根路径）。
# 必须不缓存，否则发版后客户端拿到的仍是旧 SW / 旧 manifest。
# 前端注册时已带 updateViaCache: 'none'、SW 内部对 HTML 用 cache: 'no-store'，
# 这里是服务端侧的第三道保险。
location = /app/sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
location = /app/manifest.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# ---------------- 带指纹的静态资源：长缓存 ----------------
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    gzip_static on;
}
location /app/assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    gzip_static on;
}

# ---------------- 后端 API 反向代理（youyu 监听 8090）----------------
location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 账单导入会 POST 较大 JSON（多笔流水），放宽请求体上限
client_max_body_size 20m;

gzip on;
gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_vary on;
