server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或公网 IP

    root /opt/youyu/web;
    index index.html;

    # SPA 路由回退；HTML 与 PWA 控制文件不缓存，保证发版即时生效
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # 带指纹的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # 后端 API 反向代理（youyu 监听 8090）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 账单导入会 POST 较大 JSON（多笔流水），放宽请求体上限
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
}
