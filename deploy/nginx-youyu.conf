server {
    listen 80;
    server_name youyuji.com www.youyuji.com;   # 正式域名；certbot --nginx 会据此签发证书并追加 443 配置

    root /opt/youyu/web;
    index index.html;

    # 营销落地站（Vue，根路径）：SPA 路由回退到根 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 记账应用本体（uni-app H5，同源子路径 /app/）：SPA 路由回退到 /app/index.html。
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # HTML 与 Service Worker 不缓存，保证发版即时生效。
    # sw.js 为自注销脚本，用于让历史 PWA 老客户端自愈（见 web/public/sw.js）。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 记账应用的 PWA 资源（作用域限定 /app/，勿挪到站点根路径）。
    # /app/sw.js 与 /app/manifest.json 必须不缓存，否则发版后客户端拿到的仍是旧 SW / 旧 manifest。
    # 前端注册时已带 updateViaCache: 'none' 兜底，这里是服务端侧的双保险。
    location = /app/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /app/manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 带指纹的静态资源可长缓存（落地页与记账应用各自的 assets）。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }
    location /app/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # 后端 API 反向代理（youyu 监听 8090）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 账单导入会 POST 较大 JSON（多笔流水），放宽请求体上限
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
}
