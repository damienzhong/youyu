# ============================================================
# youyu 站点的 nginx server 骨架。仅供【首次部署】安装一次：
#     cp deploy/nginx-youyu.conf /etc/nginx/conf.d/youyu.conf
#     cp deploy/nginx-youyu-locations.conf /etc/nginx/snippets/youyu-locations.conf
#     nginx -t && systemctl reload nginx
#     certbot --nginx -d youyuji.com -d www.youyuji.com   # 之后由它接管 443
#
# 装好之后【不要再覆盖这个文件】：certbot 会往里追加 listen 443 / ssl_* /
# 301 跳转等段落，覆盖会把 HTTPS 弄掉。
#
# 日常改动一律改 deploy/nginx-youyu-locations.conf —— 所有 location、缓存策略、
# 反向代理、gzip 都在那里，由 deploy/ci-deploy-remote.sh 在每次部署时自动同步
# 到 /etc/nginx/snippets/youyu-locations.conf（nginx -t 不通过会自动回滚）。
#
# 这样划分职责后，certbot 与部署脚本各改各的文件，互不覆盖：
#   certbot  → /etc/nginx/conf.d/youyu.conf     （server 骨架 + 证书）
#   部署脚本 → /etc/nginx/snippets/youyu-locations.conf（应用配置）
# ============================================================
server {
    listen 80;
    server_name youyuji.com www.youyuji.com;   # 正式域名；certbot --nginx 会据此签发证书并追加 443 配置

    # 应用配置（root / index / location / gzip / 请求体上限）全在这个片段里。
    # 它由部署脚本同步，故本文件无需随应用改动而变更。
    include /etc/nginx/snippets/youyu-locations.conf;
}
