name: Deploy

# 自动/一键部署到服务器：
#   - 自动：push 到 main 即构建并部署
#   - 手动：Actions 页面点 "Run workflow"（workflow_dispatch）
# 由 GitHub 构建机完成 mvn + npm 构建，再通过 SSH 把产物推到服务器并重启。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   SERVER_HOST     服务器 IP（如 47.120.65.57）
#   SERVER_USER     SSH 用户（root）
#   SERVER_SSH_KEY  已授权到服务器的私钥内容（可复用 lodestar 的部署私钥）
on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 同一时间只跑一个 youyu 部署，避免互相覆盖
concurrency:
  group: deploy-youyu-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend
        run: ./mvnw -B -ntp -DskipTests package

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      # 线上前端 = uni-app 的 H5 产物（与小程序同一套代码）。API 走相对 /api，nginx 反代到后端 8090。
      - name: Build frontend (H5)
        working-directory: ./miniapp
        env:
          VITE_API_BASE: /api
        run: |
          npm ci
          npm run build:h5

      - name: Stage artifacts
        run: |
          mkdir -p stage
          cp target/youyu.jar stage/youyu.jar
          tar -C miniapp/dist/build/h5 -czf stage/web.tar.gz .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifacts
        run: |
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes stage/youyu.jar "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/youyu/app/youyu.jar.new"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes stage/web.tar.gz "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/youyu-web.tar.gz"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' < deploy/ci-deploy-remote.sh
