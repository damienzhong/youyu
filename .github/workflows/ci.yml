name: CI

on:
  # 部署走 push 到 main（见 deploy.yml，且以 -DskipTests 打包），因此 main 推送不跑测试门，
  # 避免部署时被测试阻塞/刷屏。测试门仍覆盖 PR 合入 main 与 feat/**、fix/** 分支推送。
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 全量测试作为质量门（含 jqwik 属性测试），通过后再打包
      - name: Test & build
        run: ./mvnw -B -ntp package

  frontend:
    name: App (build H5 + 小程序)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./miniapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # uni-app 两端构建作为前端质量门（H5 用于线上 /app/、mp-weixin 用于小程序）
      - name: Build H5
        env:
          VITE_API_BASE: /api
        run: npm run build:h5

      - name: Build 小程序 (mp-weixin)
        run: npm run build:mp-weixin

  landing:
    name: Landing (build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 营销落地站构建作为前端质量门（纯静态，部署在根路径 /）
      - name: Build web
        run: npm run build
