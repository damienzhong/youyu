name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 全量测试作为质量门（含 jqwik 属性测试），通过后再打包
      - name: Test & build
        run: ./mvnw -B -ntp package

  frontend:
    name: Frontend (build H5 + 小程序)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./miniapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # uni-app 两端构建作为前端质量门（H5 用于线上、mp-weixin 用于小程序）
      - name: Build H5
        env:
          VITE_API_BASE: /api
        run: npm run build:h5

      - name: Build 小程序 (mp-weixin)
        run: npm run build:mp-weixin
