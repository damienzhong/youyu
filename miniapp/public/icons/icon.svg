<?xml version="1.0" encoding="UTF-8"?>
<!--
  有余 PWA 应用图标（矢量源）。
  配色与登录页 .brand-mk 一致：150deg 线性渐变 #22c55e → #16a34a(60%) → #0b6b34。
  512 画布、圆角 114（≈22.3%，贴近 iOS squircle 视觉），中央为白色 ¥ 字徽。
  同目录的 icon-192/512/apple-touch-icon.png 由本文件渲染而来（见 README 说明）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 150deg 渐变：CSS 的 150deg 自上而下偏右，等价于自 (0.25,0) 到 (0.75,1) -->
    <linearGradient id="g" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.6" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#0b6b34"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" ry="114" fill="url(#g)"/>
  <!--
    白色 ¥ 字徽用 path 描出，不依赖系统字体，保证任何渲染器下形状一致。
    结构：两笔斜画收于中心，下接竖干，横穿两道短横。
  -->
  <g fill="#ffffff">
    <!-- 左斜画 -->
    <path d="M150 132 L196 132 L268 236 L240 268 Z"/>
    <!-- 右斜画 -->
    <path d="M362 132 L316 132 L244 236 L272 268 Z"/>
    <!-- 竖干 -->
    <rect x="236" y="238" width="40" height="146" rx="6"/>
    <!-- 上横 -->
    <rect x="164" y="268" width="184" height="36" rx="6"/>
    <!-- 下横 -->
    <rect x="164" y="330" width="184" height="36" rx="6"/>
  </g>
</svg>
