spring:
  application:
    name: youyu

  # 数据源：默认本地 MySQL，可用环境变量覆盖
  datasource:
    url: ${YOUYU_DB_URL:jdbc:mysql://localhost:3306/youyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${YOUYU_DB_USER:youyu}
    password: ${YOUYU_DB_PASSWORD:youyu}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池上限：成长结算走 REQUIRES_NEW，在业务事务的 afterCommit 阶段执行——此时外层连接
      # 尚未在 afterCompletion 释放，结算又要拿一个新连接，故「同一记账请求在结算窗口内同时占用
      # 2 个连接」。容量按「并发记账请求数 × 2」估算：HikariCP 默认仅 10（只够 ~5 个并发记账请求
      # 同时结算），本项目单实例、MySQL 8 默认 max_connections=151，这里显式抬到 20，留出「并发
      # 记账请求数 × 2」的余量并给其它读请求腾出连接。池打满时结算会以「获取连接超时」失败，这正是
      # 它被设计成「失败即吞、下次自愈」的原因（需求 9.13/9.14），不会拖垮记账。可用环境变量覆盖。
      maximum-pool-size: ${YOUYU_DB_POOL_MAX_SIZE:20}

  jpa:
    hibernate:
      # 由 Flyway 管理 schema，Hibernate 只校验实体与表结构是否一致
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # 让 Hibernate 用 JDBC 4.2 的 setObject/getObject 直接绑定 java.time 类型（LocalDate(Time)），
        # 挂钟值逐字落库、逐字回读，零时区换算。这样成长体系的记账日归属（CAST(created_at AS DATE)）
        # 与自然月/报表边界不再依赖 JVM 默认时区——不靠 YouyuApplication.main 的 TimeZone.setDefault
        # 也恒正确（@SpringBootTest 不走 main，CI 又在 UTC 下运行，正是此前 Property 9 暴露的 bug）。
        # 这也让 Hibernate 的时间列写入与服务层原生 JDBC 写入（邀请关系、成长事件用 JdbcTemplate 的
        # setObject）绑定方式一致，消除两条写入路径的时区偏差。默认时区为 Asia/Shanghai 时行为不变。
        type:
          java_time_use_direct_jdbc: true
        # 刻意不设 hibernate.jdbc.time_zone：它只会把「JVM 默认时区 → 目标时区」的换算再叠一层，
        # 治标不治本（写入侧仍经 java.sql.Timestamp 的默认时区换算，且原生 JDBC 写入不受它影响，
        # 两条路径照样分叉）。真正的根治是上面的 java_time_use_direct_jdbc——绕开 java.sql.Timestamp/
        # java.sql.Date 的默认时区换算，让挂钟值逐字进出，不引入任何时区表或会话时区依赖。
    show-sql: false

  # 版本化数据库迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    time-zone: Asia/Shanghai

  # 邮件发送（QQ SMTP）：用户名/授权码务必通过环境变量注入，切勿提交明文。
  # 未配置（占位为空）时不会创建 JavaMailSender，验证码发送自动降级为日志实现（需求 1.5、1.6）。
  mail:
    host: smtp.qq.com
    port: 587
    username: ${YOUYU_MAIL_USERNAME:}
    password: ${YOUYU_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${YOUYU_PORT:8080}

# 全局时区
app:
  timezone: Asia/Shanghai
  jwt:
    # 生产环境务必通过环境变量覆盖此密钥
    secret: ${YOUYU_JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key}
    # 令牌有效期（毫秒），默认 7 天
    expiration-ms: ${YOUYU_JWT_EXPIRATION_MS:604800000}
  # 登录锁定策略：连续失败达到阈值后锁定一段时间（需求 1.7）
  auth:
    max-failed-attempts: ${YOUYU_AUTH_MAX_FAILED:5}
    lock-duration-minutes: ${YOUYU_AUTH_LOCK_MINUTES:15}
    # 邮箱验证码策略（需求 1、2）：TTL/冷却/IP 限额，均可用环境变量覆盖
    email-code:
      ttl-seconds: ${YOUYU_EMAIL_CODE_TTL_SECONDS:600}
      cooldown-seconds: ${YOUYU_EMAIL_CODE_COOLDOWN_SECONDS:60}
      ip-per-minute: ${YOUYU_EMAIL_CODE_IP_PER_MINUTE:3}
      ip-per-day: ${YOUYU_EMAIL_CODE_IP_PER_DAY:30}
      max-attempts: ${YOUYU_EMAIL_CODE_MAX_ATTEMPTS:5}
  # 用户邀请系统（需求 3.13）
  invite:
    qrcode:
      # 小程序码图片内存缓存的容量上限（项）：缺省 1000，按写入时刻 FIFO 淘汰，TTL 7 天，不落盘。
      # 每项约 20–40KB（PNG 原始字节），1000 项约 20–40MB 堆占用；堆偏小的机型可下调。
      cache-max-entries: ${YOUYU_INVITE_QRCODE_CACHE_MAX_ENTRIES:1000}
  # 微信小程序登录：appid/secret 生产环境务必通过环境变量注入，切勿提交明文
  wechat:
    api-base-url: ${YOUYU_WX_API_BASE:https://api.weixin.qq.com}
    miniapp:
      appid: ${YOUYU_WX_APPID:}
      secret: ${YOUYU_WX_SECRET:}
    # 一次性订阅消息（自定义提醒 custom-reminder）：模板 id 与文案字段名由运营在微信后台申请
    # 「提醒」订阅模板后填入。模板 id 未配置（占位为空）时，订阅消息发送安全降级为失败——既不外呼
    # 微信、也不影响记账等任何主路径（需求 6.1、11.3）。message-field 为模板中承载提醒文案的字段名
    # （随模板而定，如 thing1），文案两条均在字段长度限制内。
    subscribe:
      reminder-template-id: ${YOUYU_WX_SUBSCRIBE_TEMPLATE_ID:}
      message-field: ${YOUYU_WX_SUBSCRIBE_MESSAGE_FIELD:thing1}

# 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
