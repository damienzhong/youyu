spring:
  application:
    name: youyu

  # 数据源：默认本地 MySQL，可用环境变量覆盖
  datasource:
    url: ${YOUYU_DB_URL:jdbc:mysql://localhost:3306/youyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${YOUYU_DB_USER:youyu}
    password: ${YOUYU_DB_PASSWORD:youyu}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 由 Flyway 管理 schema，Hibernate 只校验实体与表结构是否一致
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # 金额/时间统一按 Asia/Shanghai 处理，避免时区漂移
        jdbc:
          time_zone: Asia/Shanghai
    show-sql: false

  # 版本化数据库迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${YOUYU_PORT:8080}

# 全局时区
app:
  timezone: Asia/Shanghai
  jwt:
    # 生产环境务必通过环境变量覆盖此密钥
    secret: ${YOUYU_JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key}
    # 令牌有效期（毫秒），默认 7 天
    expiration-ms: ${YOUYU_JWT_EXPIRATION_MS:604800000}

# 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
