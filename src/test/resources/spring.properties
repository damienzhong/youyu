# 仅测试类路径下生效（生产 jar 不含本文件）：放大 Spring TestContext 的上下文缓存上限。
#
# 为什么必须放大：本仓库的集成测试为了互不污染，各自声明<独立命名>的 H2 内存库
# （@TestPropertySource 里的 spring.datasource.url），因此每个类都是一份独立的应用上下文。
# 测试库由 Hibernate 以 ddl-auto=create-drop 建表，上下文关闭时会执行 DROP。
# Spring 的上下文缓存默认上限是 32：一旦上下文数量越过上限，缓存就按 LRU 淘汰并<关闭>被淘汰的上下文，
# 于是它名下那个内存库的表被 DROP 掉 —— 若被淘汰的正是用<默认>库 jdbc:h2:mem:youyu 的上下文，
# 后续仍在用该共享库的测试会以「Table "USERS" not found (this database is empty)」失败，
# 且失败的是哪个类完全取决于执行顺序，是一条极难定位的伪随机失败。
#
# 本仓库的 @SpringBootTest 类数量已经贴着 32 这条线，任何新增集成测试都会把它顶破，
# 因此这里显式给出一个宽裕的上限，而不是靠「别再加集成测试了」来维持。
#
# 2026-08 custom-reminder spec 新增了若干 @SpringBootTest（dispatch/controller/调度/只读回归等），
# 使全仓 @SpringBootTest 类数逼近 65、去重后独立上下文数越过 64，重现了上述 LRU 淘汰导致
# 「Table "USERS" not found」的伪随机失败。据此把上限抬到 128，重新留出宽裕余量。
spring.test.context.cache.maxSize=128
