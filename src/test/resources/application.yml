spring:
  # 测试用内存数据库，避免依赖本地 MySQL
  datasource:
    url: jdbc:h2:mem:youyu;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 测试环境由 Hibernate 依据实体生成 H2 表结构（生产由 Flyway 管理）。
      # 这样切片/集成测试无需依赖 MySQL 方言的迁移脚本即可验证实体映射。
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: Asia/Shanghai

  # 脚手架阶段暂无迁移脚本，测试环境关闭 Flyway
  flyway:
    enabled: false

  # 测试环境刻意不配置 SMTP：host/username 留空，Spring Boot 不会创建 JavaMailSender，
  # 验证码发送自动降级为日志实现，避免测试期间发起真实 SMTP 连接（需求 1.5、1.6）。
  mail:
    host:
    username:
    password:

app:
  jwt:
    secret: test-secret-key-only-for-unit-tests-do-not-use-in-prod
    expiration-ms: 3600000
  # 邮箱验证码策略：显式给出确定值，保证限额/TTL 相关测试可复现（需求 1、2）
  auth:
    email-code:
      ttl-seconds: 600
      cooldown-seconds: 60
      ip-per-minute: 3
      ip-per-day: 30
      max-attempts: 5
